<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validando seu dispositivo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: system-ui, sans-serif;
      background: #f3f5fa;
      color: #1a1f36;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e1e5ee;
      border-top-color: #0057ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { font-size: 18px; font-weight: 600; text-align: center; }
    #backButton {
      display: none;
      background: #0057ff;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
    }
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 30vh;
      overflow: auto;
      margin: 0;
      padding: 12px;
      font: 11px/1.5 monospace;
      color: #6b7280;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="status">Validando seu dispositivo…</div>
  <a id="backButton" href="#">Voltar ao app</a>
  <pre id="debug"></pre>
  <script type="module" src="./collect.js"></script>
</body>
</html>
